<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Print</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<style>
:root{--bg:#f3f6fa;--ink:#10213a;--mut:#5b6b82;--card:#fff;--line:#d9e1ec;--acc:#e8284f;--ok:#0f9d6b}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:0 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.acc{background:var(--acc)}button.ok{background:var(--ok)}button.ghost{background:#e8eef6;color:var(--ink)}
button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;width:100%;margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.file{display:grid;grid-template-columns:84px 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0}
.file:first-of-type{border-top:0}.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;background:#e8eef6;display:grid;place-items:center;font-weight:700;color:var(--mut)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.seg button{padding:6px 10px;font-size:.9rem;background:#e8eef6;color:var(--ink)}.seg button.on{background:var(--acc);color:#fff}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;background:#e8eef6}.tag.pending{background:#fff0c9}.tag.approved{background:#d4f3e6}.tag.printed{background:#dfe6f2}
.mut{color:var(--mut);font-size:.9rem}.hide{display:none!important}
#modal{position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;padding:12px}
#modal .box{flex:1;min-height:0}#modal img{max-width:100%;display:block}
#qr{padding:10px;background:#fff;display:inline-block;border-radius:8px}
#demo{background:#fff0c9;padding:8px 16px;text-align:center;font-size:.9rem}
@media print{body *{display:none}}
</style>
</head>
<body>
<div id="demo" class="hide">Connect ho raha hai…</div>
<main id="app"></main>
<div id="modal" class="hide"><div class="box"><img id="cropimg"></div>
<div class="row" style="margin-top:10px"><button class="ghost" id="cx">Cancel</button><button class="acc" id="cok">Crop karo</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ====== Kuch bharne ki zaroorat nahi. (Optional: Supabase use karna ho to yahan details daalo) ======
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
// =========================================================================================

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = LIVE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const banner = t => { const b = $("#demo"); b.textContent = t; b.classList.remove("hide"); };
const uid = () => crypto.randomUUID();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Backend (Supabase ya demo-localStorage) ---------- */
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const api = {
  async upload(shop, blob, meta) {
    const id = uid(), ext = (meta.type.split("/")[1] || "bin").replace("jpeg", "jpg");
    if (LIVE) {
      const path = `${shop}/${id}.${ext}`;
      let r = await sb.storage.from("docs").upload(path, blob, { contentType: meta.type });
      if (r.error) throw r.error;
      r = await sb.from("jobs").insert({ id, shop_id: shop, path, ...meta });
      if (r.error) throw r.error;
    } else { // P2P: seedha dukaan ke dashboard ko
      const conn = await connectTo(shop), data = await blob.arrayBuffer();
      await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error("Dukaan se confirmation nahi aaya, dobara try karo")), 40000);
        const h = d => { if (d && d.ack) { clearTimeout(t); conn.off("data", h); res(); } };
        conn.on("data", h); conn.send({ meta, data });
      });
    }
  },
  async list(shop) {
    if (LIVE) {
      const { data } = await sb.from("jobs").select("*").eq("shop_id", shop).neq("status", "rejected").order("created_at", { ascending: false }).limit(50);
      return data || [];
    }
    return memJobs.filter(j => j.status !== "rejected");
  },
  async setStatus(j, status) {
    if (LIVE) await sb.from("jobs").update({ status }).eq("id", j.id); else j.status = status;
  },
  async blobOf(j) {
    if (LIVE) { const { data, error } = await sb.storage.from("docs").download(j.path); if (error) throw error; return data; }
    return j.blob;
  },
  async wipe(j) { // print ke baad file delete (privacy)
    if (LIVE) { await sb.storage.from("docs").remove([j.path]); await sb.from("jobs").update({ path: null, status: "printed" }).eq("id", j.id); }
    else { j.blob = null; j.status = "printed"; }
  },
  watch(shop, cb) {
    if (LIVE) sb.channel("jobs-" + shop).on("postgres_changes", { event: "*", schema: "public", table: "jobs", filter: `shop_id=eq.${shop}` }, cb).subscribe();
    else onJobs = cb;
  }
};

/* ---------- P2P (bina account/server): customer phone -> dukaan ka browser ---------- */
let memJobs = [], onJobs = () => {}, owner, cust;
function startOwner(id) {
  owner = new Peer(id);
  owner.on("open", () => banner("✅ Online — customer file bhej sakte hain. Ye page khula rakho."));
  owner.on("connection", c => c.on("data", d => {
    if (!d || !d.meta) return;
    const job = { id: uid(), shop_id: id, blob: new Blob([d.data], { type: d.meta.type }), status: "pending", created_at: new Date().toISOString(), ...d.meta };
    memJobs.unshift(job); c.send({ ack: job.id }); onJobs();
  }));
  owner.on("disconnected", () => { banner("Internet gaya, wapas jud rahe hain…"); owner.reconnect(); });
  owner.on("error", e => {
    if (e.type === "unavailable-id") { banner("Connect ho raha hai… (agar ye page doosre tab me khula hai to use band karo)"); owner.destroy(); setTimeout(() => startOwner(id), 5000); }
    else banner("⚠ Connection dikkat: " + e.type);
  });
}
function connectTo(shop) {
  if (cust && cust.shop === shop && cust.conn.open) return Promise.resolve(cust.conn);
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("Dukaan se connect nahi hua. Dukaan wale se kaho dashboard khula rakhe, aur apna net check karo.")), 25000);
    const p = new Peer();
    p.on("error", e => { clearTimeout(t); rej(new Error(e.type === "peer-unavailable" ? "Dukaan ka dashboard abhi online nahi hai." : "Connection error: " + e.type)); });
    p.on("open", () => { const c = p.connect(shop, { reliable: true }); c.on("open", () => { clearTimeout(t); cust = { shop, conn: c }; res(c); }); });
  });
}

/* ---------- Image tools: crop + AI-style enhance (free, browser me) ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function toCanvas(img, max = 2200) {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c;
}
function levels(d, gray) { // auto contrast: 1%-99% stretch
  const h = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)], n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) for (let c = 0; c < 3; c++) h[c][d[i + c]]++;
  const rng = h.map(x => { let a = 0, lo = 0, hi = 255; while (lo < 255 && (a += x[lo]) < n * .01) lo++; a = 0; while (hi > 0 && (a += x[hi]) < n * .01) hi--; return [lo, Math.max(hi, lo + 1)]; });
  const avg = [Math.min(...rng.map(r => r[0])), Math.max(...rng.map(r => r[1]))];
  for (let i = 0; i < d.length; i += 4) for (let c = 0; c < 3; c++) {
    const [lo, hi] = gray ? avg : rng[c]; d[i + c] = Math.max(0, Math.min(255, (d[i + c] - lo) * 255 / (hi - lo)));
  }
}
function sharpen(ctx, w, h, amt = .6) {
  const src = ctx.getImageData(0, 0, w, h), out = ctx.createImageData(w, h), s = src.data, o = out.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    for (let c = 0; c < 3; c++) {
      const v = (x > 0 && y > 0 && x < w - 1 && y < h - 1)
        ? s[i + c] * (1 + 4 * amt) - amt * (s[i - 4 + c] + s[i + 4 + c] + s[i - w * 4 + c] + s[i + w * 4 + c]) : s[i + c];
      o[i + c] = Math.max(0, Math.min(255, v));
    } o[i + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}
async function enhance(blob, mode) { // mode: orig | auto | scan
  if (mode === "orig") return blob;
  const c = toCanvas(await loadImg(URL.createObjectURL(blob))), x = c.getContext("2d"), im = x.getImageData(0, 0, c.width, c.height);
  if (mode === "scan") {
    for (let i = 0; i < im.data.length; i += 4) { const g = .3 * im.data[i] + .59 * im.data[i + 1] + .11 * im.data[i + 2]; im.data[i] = im.data[i + 1] = im.data[i + 2] = g; }
    levels(im.data, true);
    for (let i = 0; i < im.data.length; i += 4) { const v = im.data[i] / 255, s = 255 / (1 + Math.exp(-10 * (v - .55))); im.data[i] = im.data[i + 1] = im.data[i + 2] = s; }
    x.putImageData(im, 0, 0);
  } else { levels(im.data, false); x.putImageData(im, 0, 0); sharpen(x, c.width, c.height); }
  return new Promise(r => c.toBlob(r, "image/jpeg", .92));
}
let cropper;
function cropDialog(blob) {
  return new Promise(res => {
    const m = $("#modal"), im = $("#cropimg"); im.src = URL.createObjectURL(blob); m.classList.remove("hide");
    cropper = new Cropper(im, { viewMode: 1, autoCropArea: .95, background: false });
    const done = v => { cropper.destroy(); m.classList.add("hide"); res(v); };
    $("#cx").onclick = () => done(null);
    $("#cok").onclick = () => cropper.getCroppedCanvas({ maxWidth: 2600, maxHeight: 2600 }).toBlob(b => done(b), "image/jpeg", .95);
  });
}

/* ---------- Customer page: QR scan -> upload ---------- */
const files = []; // {orig, blob, mode, name, type, copies, color}
function customer(shop) {
  app.innerHTML = `<h1>Document print karo</h1><p class="mut">File chuno, crop/enhance karo, bhejo. Dukaan wala approve karke print karega.</p>
  <div class="card"><input id="pick" type="file" accept="image/*,application/pdf" multiple>
  <div id="list"></div></div>
  <div class="card hide" id="send"><label>Aapka naam / mobile (counter par pehchan ke liye)<input id="who" placeholder="Rahul - 98xxxxxx"></label>
  <button class="acc" id="go" style="width:100%">Dukaan ko bhejo</button><p class="mut" id="msg"></p></div>`;
  $("#pick").onchange = async e => {
    for (const f of e.target.files) files.push({ orig: f, blob: f, mode: "orig", name: f.name, type: f.type, copies: 1, color: false });
    e.target.value = ""; draw();
  };
  $("#go").onclick = async () => {
    const b = $("#go"); b.disabled = true; $("#msg").textContent = "Bhej rahe hain…";
    try {
      for (const f of files) {
        const out = f.type.startsWith("image/") ? await enhance(f.blob, f.mode) : f.blob;
        await api.upload(shop, out, { name: ($("#who").value ? $("#who").value + " · " : "") + f.name, type: out.type || f.type, copies: f.copies, color: f.color });
      }
      files.length = 0; app.innerHTML = `<div class="card"><h2>✅ Bhej diya</h2><p>Ab dukaan par jaake batao. Owner approve karte hi print ho jayega.</p><button onclick="location.reload()">Aur file bhejo</button></div>`;
    } catch (err) { $("#msg").textContent = "Error: " + (err.message || err); b.disabled = false; }
  };
}
async function draw() {
  const L = $("#list"); L.innerHTML = "";
  $("#send").classList.toggle("hide", !files.length);
  files.forEach((f, i) => {
    const img = f.type.startsWith("image/"), d = document.createElement("div"); d.className = "file";
    d.innerHTML = `<div class="thumb">${img ? `<img class="thumb" id="t${i}">` : "PDF"}</div><div>
      <b>${esc(f.name)}</b>
      ${img ? `<div class="seg" data-m>${[["orig", "Original"], ["auto", "AI Enhance"], ["scan", "Scan B&W"]].map(([k, t]) => `<button data-k="${k}" class="${f.mode === k ? "on" : ""}">${t}</button>`).join("")}</div>
      <button class="ghost" data-crop>✂ Crop</button>` : `<p class="mut">PDF jaisa hai waisa print hoga</p>`}
      <div class="row" style="margin-top:8px"><label>Copies<input type="number" min="1" max="99" value="${f.copies}" data-c></label>
      <label>Print<select data-col><option value="0">Black & White</option><option value="1" ${f.color ? "selected" : ""}>Colour</option></select></label></div>
      <button class="ghost" data-del>Hatao</button></div>`;
    L.append(d);
    if (img) enhance(f.blob, f.mode).then(b => { const t = $("#t" + i); if (t) t.src = URL.createObjectURL(b); });
    d.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { f.mode = b.dataset.k; draw(); });
    d.querySelector("[data-crop]")?.addEventListener("click", async () => { const r = await cropDialog(f.blob); if (r) { f.blob = r; f.type = "image/jpeg"; draw(); } });
    d.querySelector("[data-c]").onchange = e => f.copies = Math.max(1, +e.target.value || 1);
    d.querySelector("[data-col]").onchange = e => f.color = e.target.value === "1";
    d.querySelector("[data-del]").onclick = () => { files.splice(i, 1); draw(); };
  });
}

/* ---------- Owner dashboard ---------- */
async function admin() {
  let shop;
  if (LIVE) {
    const { data } = await sb.auth.getSession();
    if (!data.session) return login();
    shop = data.session.user.id;
  } else {
    shop = localStorage.qsp_id || (localStorage.qsp_id = "qp" + uid().replace(/-/g, "").slice(0, 16));
    if (!owner) { banner("Connect ho raha hai…"); startOwner(shop); }
  }
  const link = location.origin + location.pathname + "?shop=" + shop;
  app.innerHTML = `<h1>Shop Dashboard</h1>
  <div class="card row"><div><h2>Aapka QR</h2><div id="qr"></div></div>
  <div><p class="mut">Ye QR dukaan me chipka do. Link:</p>${location.protocol === "file:" ? '<p class="mut" style="color:#c00">⚠ Ye page abhi apne laptop se khula hai. QR phone me tabhi chalega jab ye file GitHub par daalke uska https link kholo.</p>' : ""}<input readonly value="${link}" onclick="this.select()">
  <button class="ghost" onclick="downloadQR()">QR download</button> ${LIVE ? `<button class="ghost" id="out">Logout</button>` : ""}</div></div>
  <h2>Aaye hue documents</h2><div id="jobs"></div>`;
  new QRCode($("#qr"), { text: link, width: 160, height: 160 });
  if (LIVE) $("#out").onclick = async () => { await sb.auth.signOut(); admin(); };
  const render = async () => {
    const jobs = await api.list(shop), box = $("#jobs");
    box.innerHTML = jobs.length ? "" : `<div class="card mut">Abhi koi document nahi aaya. QR scan karke test karo.</div>`;
    for (const j of jobs) {
      const d = document.createElement("div"); d.className = "card";
      d.innerHTML = `<div class="row"><div style="flex:3"><b>${esc(j.name)}</b><br><span class="mut">${j.copies} copy · ${j.color ? "Colour" : "B&W"} · ${new Date(j.created_at).toLocaleTimeString()}</span></div>
      <span class="tag ${j.status}" style="flex:0">${{ pending: "Approval baaki", approved: "Approved", printed: "Print ho gaya" }[j.status] || j.status}</span></div>
      <div class="row" style="margin-top:10px">
      ${j.status === "pending" ? `<button class="ghost" data-v>Dekho</button><button class="ok" data-a>Approve + Print</button><button class="ghost" data-r>Reject</button>` : ""}
      ${j.status === "approved" ? `<button class="acc" data-p>Print karo</button>` : ""}</div>`;
      box.append(d);
      d.querySelector("[data-v]")?.addEventListener("click", async () => window.open(URL.createObjectURL(await api.blobOf(j))));
      d.querySelector("[data-a]")?.addEventListener("click", async () => { await api.setStatus(j, "approved"); printJob(j, render); });
      d.querySelector("[data-p]")?.addEventListener("click", () => printJob(j, render));
      d.querySelector("[data-r]")?.addEventListener("click", async () => { if (j.path && LIVE) await sb.storage.from("docs").remove([j.path]); await api.setStatus(j, "rejected"); render(); });
    }
  };
  render(); api.watch(shop, render);
}
async function printJob(j, done) {
  const blob = await api.blobOf(j), url = URL.createObjectURL(blob), w = window.open("", "_blank");
  if (blob.type === "application/pdf") { w.location = url; }
  else {
    const pages = Array.from({ length: j.copies }, () => `<img src="${url}">`).join("");
    w.document.write(`<style>@page{margin:8mm}body{margin:0}img{display:block;width:100%;max-height:277mm;object-fit:contain;page-break-after:always}</style>${pages}`);
    w.document.close(); await Promise.all([...w.document.images].map(i => i.decode().catch(() => 0)));
    w.focus(); w.print();
  }
  if (confirm("Print ho gaya? 'OK' dabate hi file server se delete ho jayegi.")) { await api.wipe(j); w.close?.(); }
  done();
}
function downloadQR() { const c = $("#qr canvas"), a = document.createElement("a"); a.href = c.toDataURL(); a.download = "shop-qr.png"; a.click(); }
function login() {
  app.innerHTML = `<h1>Shop Owner Login</h1><div class="card"><label>Email<input id="em" type="email"></label><label>Password (6+ akshar)<input id="pw" type="password"></label>
  <div class="row"><button id="li">Login</button><button class="ghost" id="su">Naya shop banao</button></div><p class="mut" id="msg"></p></div>`;
  const go = fn => async () => { const { error } = await fn({ email: $("#em").value, password: $("#pw").value }); error ? $("#msg").textContent = error.message : admin(); };
  $("#li").onclick = go(x => sb.auth.signInWithPassword(x)); $("#su").onclick = go(x => sb.auth.signUp(x));
}

/* ---------- Router ---------- */
const shop = new URLSearchParams(location.search).get("shop");
if (location.hash === "#admin" || location.hash === "#/admin") admin();
else if (shop) customer(shop);
else app.innerHTML = `<h1>QR Print</h1><div class="card"><p>Shop owner ho? Dashboard kholo:</p><a class="btn" href="#admin" onclick="setTimeout(()=>location.reload())">Owner Dashboard</a></div>
  <p class="mut">Customer ko ye page nahi dikhega — wo shop ke QR se seedha upload page par jayega.</p>`;
</script>
</body>
</html>
