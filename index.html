<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06306b">
<title>QR Print</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f1d3a;--mut:#62708f;--line:#dfe7f4;--navy:#06306b;--blue:#0b6fd6;--amber:#f5a300;--ok:#059669;--bad:#dc2626;--chip:#e9f0fb}
@media(prefers-color-scheme:dark){:root{--bg:#0a1226;--card:#12203f;--ink:#eaf1ff;--mut:#9db0d6;--line:#22345f;--chip:#1b2c52}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
main{max-width:760px;margin:0 auto;padding:0 16px 130px}
h2{font-size:1.1rem;margin:0 0 4px;letter-spacing:-.01em}.sec{margin:28px 4px 12px;font-size:1.2rem}
.mut{color:var(--mut);font-size:.9rem}small{color:var(--mut)}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #ffffff55,0 10px 30px -8px #0008;background:#0b6fd6}
.logo.sm{width:40px;height:40px;box-shadow:0 0 0 2px var(--line)}
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 30px) 22px 74px;background:radial-gradient(120% 80% at 85% 0,#f5a30055,transparent 55%),linear-gradient(160deg,#06306b,#0b6fd6)}
.hero h1{margin:16px 0 6px;font-size:1.65rem;letter-spacing:-.02em}.hero p{margin:0 auto;max-width:440px;opacity:.92}
.pill{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:99px;background:#ffffff22;border:1px solid #ffffff44;font-size:.82rem;font-weight:600;letter-spacing:.04em}
.pull{margin-top:-48px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 14px 34px -20px rgba(6,48,107,.45)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:16px 6px;border-radius:16px;background:var(--chip);border:1.5px solid transparent;cursor:pointer;transition:.15s}
.tile:active{transform:scale(.97);border-color:var(--blue)}.tile b{font-size:.95rem}.tile small{font-size:.75rem;line-height:1.2}
.tile input{position:absolute;opacity:0;width:0;height:0}
.ti{font-size:1.7rem;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--card);margin-bottom:6px;box-shadow:0 4px 12px -6px #0b6fd688}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(135deg,var(--blue),#0a56b0);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.ok{background:var(--ok)}.btn.amber{background:linear-gradient(135deg,#ffbf2e,var(--amber));color:#2b1b00}.btn.bad{background:transparent;color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:.88rem;border-radius:11px}.btn:disabled{opacity:.55}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7ab6ff;outline-offset:2px}
input[type=text],input[type=tel],input[type=url],input:not([type]),select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{display:grid;grid-template-columns:88px 1fr;gap:14px}
.file:first-child{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.file+.file{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.thumb{width:88px;height:112px;border-radius:12px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--mut)}
.fname{font-weight:600;word-break:break-all;font-size:.93rem}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;margin:6px 6px 0 0}
.seg button{font:inherit;font-size:.83rem;border:0;background:none;color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.step{display:inline-flex;align-items:center;background:var(--chip);border-radius:10px;margin:6px 6px 0 0}
.step button{border:0;background:none;color:var(--ink);font-size:1.2rem;width:34px;height:34px;cursor:pointer}.step b{min-width:26px;text-align:center}
.file select{padding:7px 10px;margin:6px 0 0;width:auto;font-size:.88rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:760px;margin:0 auto}.bar .btn{width:100%;font-size:1.05rem;position:relative;overflow:hidden}
#prog{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff44;transition:width .2s}
.stars{color:var(--amber);font-size:1.5rem;letter-spacing:3px}
.review{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#fff8e6,#fff);border-color:#f6dc9c}
@media(prefers-color-scheme:dark){.review{background:linear-gradient(135deg,#2a2410,var(--card));border-color:#5a4a16}}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:640px){.svc{grid-template-columns:repeat(3,1fr)}}
.sv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 26px -22px rgba(6,48,107,.6)}
.sv i{font-style:normal;font-size:1.4rem;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--chip);margin-bottom:8px}
.sv b{display:block;line-height:1.25;font-size:.95rem}.sv span{color:var(--mut);font-size:.8rem;line-height:1.3;display:block;margin-top:3px}
.contact{display:flex;gap:14px;align-items:center}.foot{text-align:center;color:var(--mut);font-size:.8rem;margin:26px 0}
.done{text-align:center;padding:30px 12px}.done .tick{font-size:3.4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand b{display:block;line-height:1.2}.brand small{font-size:.78rem}
.st{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut);white-space:nowrap}.st i{width:10px;height:10px;border-radius:50%;background:#f59e0b}.st.on i{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}.stats b{display:block;font-size:1.6rem;line-height:1.1}.stats span{font-size:.78rem;color:var(--mut)}
.stats .w b{color:var(--amber)}.stats .a b{color:var(--blue)}.stats .p b{color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.job{display:grid;grid-template-columns:72px 1fr;gap:14px}.job .thumb{width:72px;height:92px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--chip);margin-right:2px}
.chip.pending{background:#fff1c9;color:#7a5200}.chip.approved{background:#d7f5e8;color:#06623f}.chip.printed{opacity:.7}
.job.printed{opacity:.65}.empty{text-align:center;color:var(--mut);padding:30px 10px}
.qrrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.qrbox{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line)}.qinfo{flex:1;min-width:220px}
.note{color:var(--mut);font-size:.84rem;margin:22px 4px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#0f1d3a;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#000e;z-index:30;display:flex;flex-direction:column;padding:12px}
#modal .mbox{flex:1;min-height:0}#modal img{max-width:100%;display:block}.mbar{display:flex;gap:10px;padding-top:10px}.mbar .btn{flex:1}
/* ===== Motion ===== */
html{scroll-behavior:smooth}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px #ffffff55,0 10px 30px -8px #0008}50%{box-shadow:0 0 0 11px #ffffff14,0 14px 36px -8px #000a}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.25)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes ping{0%{box-shadow:0 0 0 0 #05966980}80%,100%{box-shadow:0 0 0 9px #0596690}}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 #0b6fd666}60%{box-shadow:0 0 0 12px #0b6fd600}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%{box-shadow:0 0 0 0 #f5a30099}100%{box-shadow:0 0 0 14px #f5a30000}}
body{animation:fadeIn .45s ease both}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(8px)}
.hero::before{width:260px;height:260px;right:-70px;top:-90px;background:#f5a30033;animation:drift 11s ease-in-out infinite alternate}
.hero::after{width:200px;height:200px;left:-60px;bottom:-80px;background:#ffffff1c;animation:drift 14s ease-in-out infinite alternate-reverse}
.hero>*{position:relative;z-index:1}
.hero .logo{animation:logoIn .9s cubic-bezier(.2,1.3,.4,1) both,glow 3.6s ease-in-out 1.2s infinite}
.hero h1{animation:fadeUp .7s .15s cubic-bezier(.2,.7,.2,1) both}
.hero p{animation:fadeUp .7s .28s cubic-bezier(.2,.7,.2,1) both}
.hero .pill{animation:fadeUp .7s .4s cubic-bezier(.2,.7,.2,1) both}
.pull>.card:first-child{animation:fadeUp .7s .35s cubic-bezier(.2,.7,.2,1) both}
.btn,.tile,.sv,.card,.seg button,.step button,.ti{transition:transform .2s ease,box-shadow .25s ease,background .2s ease,color .2s ease,border-color .2s ease,opacity .2s}
.btn:active{transform:scale(.96)}.step button:active{transform:scale(.8)}
.tile:active{transform:scale(.96)}
@media(hover:hover){
 .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px #0b6fd699}
 .btn.ghost:hover,.btn.bad:hover{box-shadow:none;background:#dbe7f8}
 .tile:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 14px 26px -16px #0b6fd6}
 .tile:hover .ti{transform:translateY(-2px) rotate(-6deg) scale(1.08)}
 .sv:hover{transform:translateY(-4px);box-shadow:0 18px 30px -20px rgba(6,48,107,.8);border-color:#9ec5f3}
 .sv:hover i{transform:scale(1.1) rotate(-5deg)}
}
.sv i{transition:transform .25s ease}
.file.enter,.job.enter{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
.job.enter.pending{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both,flash 1.4s .3s ease-out 2}
.bar:not([hidden]){animation:slideUp .4s cubic-bezier(.2,.8,.2,1) both}
.bar .btn:not(:disabled){animation:pulseBtn 2.6s ease-in-out infinite}
.btn:disabled #sendt::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
#modal:not([hidden]){animation:fadeIn .25s ease both}
.stars{background:linear-gradient(90deg,#f5a300,#ffe08a,#f5a300);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite}
.st.on i{animation:ping 2.2s ease-out infinite}
.done .tick{display:inline-block;animation:pop .7s cubic-bezier(.2,1.2,.4,1) both}
.done h2,.done p,.done .btn{animation:fadeUp .6s .3s both}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.2,.7,.2,1),transform .65s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
/* ===== Theme v3 ===== */
@keyframes sweep{0%{transform:translateX(-130%)}60%,100%{transform:translateX(130%)}}
@keyframes floatUp{0%{transform:translateY(40px) rotate(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-260px) rotate(25deg);opacity:0}}
@keyframes borderFlow{to{background-position:0 0,300% 0}}
@keyframes popStar{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 #ffffff66}100%{box-shadow:0 0 0 26px #ffffff00}}
h1,h2{font-weight:800}
.hero{border-radius:0 0 38px 38px;padding-bottom:84px;background:radial-gradient(90% 70% at 90% -10%,#f5a30066,transparent 60%),radial-gradient(70% 60% at 0 100%,#38bdf855,transparent 60%),linear-gradient(160deg,#04245a,#0b6fd6)}
.hero>.fl{position:absolute;z-index:0;bottom:0;font-size:1.5rem;opacity:0;pointer-events:none;animation:floatUp 8s linear infinite}
.pull{margin-top:-58px}
.pull>.card:first-child{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,#0b6fd6,#38bdf8,#f5a300,#0b6fd6) border-box;background-size:100% 100%,300% 100%;animation:fadeUp .7s .35s cubic-bezier(.2,.7,.2,1) both,borderFlow 7s linear 1s infinite}
.tile{animation:fadeUp .6s both}.tile:nth-child(1){animation-delay:.55s}.tile:nth-child(2){animation-delay:.67s}.tile:nth-child(3){animation-delay:.79s}
.tile:nth-child(1) .ti{background:rgba(11,111,214,.16)}.tile:nth-child(2) .ti{background:rgba(124,58,237,.16)}.tile:nth-child(3) .ti{background:rgba(245,163,0,.22)}
.tile{background:transparent;border:1.5px solid var(--line)}
.sec::after{content:"";display:block;width:46px;height:4px;border-radius:4px;margin-top:7px;background:linear-gradient(90deg,var(--blue),var(--amber))}
.sv:nth-child(6n+1) i{background:rgba(11,111,214,.16)}.sv:nth-child(6n+2) i{background:rgba(124,58,237,.16)}.sv:nth-child(6n+3) i{background:rgba(245,163,0,.22)}
.sv:nth-child(6n+4) i{background:rgba(5,150,105,.16)}.sv:nth-child(6n+5) i{background:rgba(236,72,153,.16)}.sv:nth-child(6n) i{background:rgba(14,165,233,.18)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.steps::before{content:"";position:absolute;left:16%;right:16%;top:27px;height:2px;background:repeating-linear-gradient(90deg,var(--blue) 0 8px,transparent 8px 16px);opacity:.35}
.steps>div{text-align:center;position:relative;padding:0 4px}
.steps b{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#0a56b0);color:#fff;font-size:1.2rem;box-shadow:0 10px 20px -10px #0b6fd6,0 0 0 5px var(--bg)}
.steps h3{margin:0;font-size:.95rem}.steps span{display:block;color:var(--mut);font-size:.8rem;line-height:1.3;margin-top:2px}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.btn:hover::after{transition:transform .7s;transform:translateX(130%)}
.btn.amber::after{animation:sweep 3.4s ease-in-out infinite}.btn.ghost::after,.btn.bad::after{display:none}
.review{border-radius:22px}
.rate{text-align:center;padding:26px 20px;background:linear-gradient(160deg,#fff7e0,#fff 55%);border-color:#f6dc9c}
@media(prefers-color-scheme:dark){.rate{background:linear-gradient(160deg,#2b2410,var(--card) 60%);border-color:#5a4a16}}
.rate-badge{width:64px;height:64px;margin:-48px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(135deg,#ffcf4d,var(--amber));box-shadow:0 12px 24px -10px #f5a300;animation:pop .8s .5s cubic-bezier(.2,1.4,.4,1) both}
.rate h2{font-size:1.35rem;margin:0 0 6px}.rate p{color:var(--mut);margin:0 auto 12px;max-width:430px;font-size:.95rem}
.stars-row{display:flex;flex-direction:row-reverse;justify-content:center;margin:8px 0 2px}
.star{font:inherit;font-size:2.7rem;line-height:1;background:none;border:0;color:#cfd6e4;cursor:pointer;padding:2px 5px;transition:color .15s,transform .2s;animation:popStar .6s var(--d,0ms) cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 2px 0 #0000000a}
.star:hover,.star:hover~.star,.star.sel,.star.sel~.star{color:var(--amber);transform:scale(1.18) rotate(-6deg)}
.rate-msg{min-height:1.6em;font-weight:600;color:var(--ink);margin:2px 0 14px}
.rate .btn{width:100%;max-width:340px;font-size:1.02rem}.rate small{display:block;margin-top:12px}
.hero .okring{width:84px;height:84px;margin:0 auto;border-radius:50%;background:#ffffff1f;animation:ring 1.8s .9s ease-out 2}
.okring svg{width:84px;height:84px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.okring circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .8s .15s ease forwards}.okring path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .8s ease forwards}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti i{position:absolute;width:9px;height:14px;border-radius:2px}
.top{background:linear-gradient(135deg,#04245a,#0b6fd6);color:#fff;border:0;box-shadow:0 8px 24px -14px #04245a}
.top small,.top .st{color:#ffffffcc}.top .logo.sm{box-shadow:0 0 0 2px #ffffff88}
.stats div{position:relative;overflow:hidden}.stats .w{border-top:3px solid var(--amber)}.stats .a{border-top:3px solid var(--blue)}.stats .p{border-top:3px solid var(--ok)}
.job{border-left:4px solid var(--line)}.job.pending{border-left-color:var(--amber)}.job.approved{border-left-color:var(--blue)}.job.printed{border-left-color:var(--ok)}

/* ===== Splash + skeleton ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff;
 background:radial-gradient(90% 70% at 90% -10%,#f5a30066,transparent 60%),radial-gradient(70% 60% at 0 100%,#38bdf855,transparent 60%),linear-gradient(160deg,#04245a,#0b6fd6)}
#splash.out{opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s .55s}
.sp-logo{position:relative;width:124px;height:124px}
.sp-logo img{width:124px;height:124px;border-radius:50%;box-shadow:0 0 0 4px #ffffff44,0 14px 30px -8px #000a;animation:spPulse 1.8s ease-in-out infinite,logoIn .8s cubic-bezier(.2,1.3,.4,1) both}
.sp-logo i{position:absolute;inset:-13px;border-radius:50%;background:conic-gradient(#f5a300,#38bdf8,transparent 72%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 1.1s linear infinite}
.sp-t{font-weight:700;letter-spacing:.3px;animation:fadeUp .7s .2s both}
.sp-bar{width:170px;height:5px;border-radius:5px;background:#ffffff30;overflow:hidden}
.sp-bar b{display:block;height:100%;width:45%;border-radius:5px;background:linear-gradient(90deg,#f5a300,#ffe08a);animation:spSlide 1.3s ease-in-out infinite}
@keyframes spPulse{50%{transform:scale(1.06)}}@keyframes spSlide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.sk{height:112px;background:linear-gradient(90deg,var(--card) 25%,var(--chip) 50%,var(--card) 75%);background-size:200% 100%;animation:shine 1.4s linear infinite}
</style>

</head>
<body>
<div id="splash"><div class="sp-logo"><i></i><img id="spImg" alt=""></div><div class="sp-t">Loading…</div><div class="sp-bar"><b></b></div></div>
<div id="app"></div><div id="toast" role="status"></div>

  ["📒", "Passbook & Statement", "Print and mini statement"], ["🖨️", "Print, Xerox & Photo", "Documents and passport photos"]
];
const DOCS = ["Document", "Aadhaar", "PAN", "Photo", "Passbook", "Form", "Other"];
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const ico = document.createElement("link"); ico.rel = "icon"; ico.href = LOGO; document.head.append(ico);

/* ================= CUSTOMER ================= */
const params = new URLSearchParams(location.search), topic = params.get("s");
const S = { name: params.get("n") || CFG.name, welcome: params.get("w") || CFG.welcome, review: safeUrl(params.get("r") || CFG.review), phone: (params.get("p") || CFG.phone).replace(/[^\d+]/g, "") };
const files = [];
const reviewCard = () => S.review ? `<section class="card review"><div><div class="stars" aria-hidden="true">★★★★★</div><b>Enjoyed our service?</b><div class="mut">Rate us on Google. It takes 10 seconds.</div></div><a class="btn amber" href="${esc(S.review)}" target="_blank" rel="noopener">Rate us on Google</a></section>` : "";
function customerView() {
  document.title = S.name + " | Upload & Print";
  const tile = (attr, ic, t, s) => `<label class="tile"><input type="file" data-pick ${attr}><span class="ti">${ic}</span><b>${t}</b><small>${s}</small></label>`;
  app.innerHTML = `<header class="hero">${floaters()}<img class="logo" src="${LOGO}" alt="${esc(S.name)} logo"><h1>${esc(S.name)}</h1><p>${esc(S.welcome)}</p><span class="pill">BCA ID · ${CFG.bca}</span></header>
  <main class="pull">
  <section class="card" id="up"><h2>Upload your documents</h2><p class="mut" style="margin:0">Add any file type: photos, PDF, Word, Excel, PowerPoint and more.</p>
  <div class="tiles">${tile('accept="image/*" capture="environment"', "📷", "Camera", "Scan a document")}${tile('accept="image/*,.heic,.heif" multiple', "🖼️", "Gallery", "Photos")}${tile('multiple', "📁", "Any file", "PDF, Word, Excel…")}</div>
  <div id="list"></div>
  <div id="whowrap" hidden style="margin-top:16px"><label><b>Your name or phone number</b><input id="who" type="text" placeholder="So we can find your order" autocomplete="name"></label></div></section>
  ${reviewCard()}
  <h2 class="sec">How it works</h2>
  <div class="steps"><div><b>1</b><h3>Upload</h3><span>Add photos or PDFs</span></div><div><b>2</b><h3>We check</h3><span>Approve and print</span></div><div><b>3</b><h3>Collect</h3><span>Pick up at the counter</span></div></div>
  <h2 class="sec">Our services</h2>
  <div class="svc">${SERVICES.map(([i, t, d]) => `<div class="sv"><i>${i}</i><b>${t}</b><span>${d}</span></div>`).join("")}</div>
  <p class="mut" style="margin:12px 4px">Services may vary. Please confirm at the counter.</p>
  <section class="card contact"><img class="logo sm" src="${LOGO}" alt=""><div style="flex:1"><b>${esc(S.name)}</b><div class="mut">BCA ID ${CFG.bca}</div></div>
  ${S.phone ? `<a class="btn ghost sm" href="tel:${S.phone}">Call</a> <a class="btn ok sm" href="https://wa.me/${S.phone.replace(/^\+/, "")}" target="_blank" rel="noopener">WhatsApp</a>` : ""}</section>
  <p class="foot">Your files are used only for your request.</p></main>
  <div class="bar" id="bar" hidden><div class="in"><button class="btn" id="send"><span id="prog"></span><span id="sendt">Send to shop</span></button></div></div>`;
  document.querySelectorAll("[data-pick]").forEach(inp => inp.onchange = async e => {
    const list = [...e.target.files]; e.target.value = "";
    for (const f of list) {
      if (f.size > 40e6) { toast(f.name + " is too large"); continue; }
      try { files.push(await makeItem(f)); render(); } catch (err) { toast(err.message || "Could not add " + f.name); }
    }
  });
  $("#send").onclick = sendAll;
  reveal(".sec,.steps>div,.sv,.review,.contact,.foot");
}
async function makeItem(f) {
  const ext = (f.name.split(".").pop() || "FILE").slice(0, 5).toUpperCase();
  const it = { name: f.name, ext, copies: 1, color: false, mode: "orig", doc: "Document", prev: {}, img: false, raw: true, pdf: false };
  if (f.type.startsWith("image/") || /\.(heic|heif|avif|jfif|tiff?)$/i.test(f.name)) {
    try { await setBlob(it, f); it.img = true; it.raw = false; return it; } catch { /* not decodable here: send the original file */ }
  }
  if (f.size > 14.5e6) throw new Error(f.name + " is over 15 MB. Please send a smaller file.");
  it.blob = f; it.pdf = f.type === "application/pdf" || ext === "PDF"; return it;
}
async function setBlob(it, src) {
  const url = URL.createObjectURL(src), img = await loadImg(url), c = toCanvas(img, 1800);
  URL.revokeObjectURL(url); it.blob = await toBlob(c, .9); it.small = toCanvas(c, 360); it.prev = {};
}
function preview(it) {
  if (it.prev[it.mode]) return it.prev[it.mode];
  const c = document.createElement("canvas"); c.width = it.small.width; c.height = it.small.height; c.getContext("2d").drawImage(it.small, 0, 0);
  return it.prev[it.mode] = enhanceCanvas(c, it.mode).toDataURL("image/jpeg", .75);
}
function render() {
  $("#whowrap").hidden = $("#bar").hidden = !files.length;
  $("#list").innerHTML = files.map((f, i) => `<div class="file${f.shown ? "" : " enter"}" data-i="${i}">
    ${f.raw ? `<div class="thumb">${esc(f.ext)}</div>` : `<img class="thumb" alt="" src="${preview(f)}">`}
    <div><div class="fname">${esc(f.name)}</div>
    ${f.raw ? '<div class="mut">Sent as the original file</div>' : `<div class="seg">${[["orig", "Original"], ["auto", "Enhance"], ["scan", "Scan B&amp;W"]].map(([k, t]) => `<button data-k="${k}" class="${f.mode === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <button class="btn ghost sm" data-crop style="margin-top:6px">Crop</button>`}
    <div><span class="step"><button data-m="-1" aria-label="Fewer copies">−</button><b>${f.copies}</b><button data-m="1" aria-label="More copies">+</button></span><span class="mut">copies</span>
    <span class="seg"><button data-col="0" class="${f.color ? "" : "on"}">B&amp;W</button><button data-col="1" class="${f.color ? "on" : ""}">Colour</button></span></div>
    <div class="row"><select data-doc aria-label="Document type">${DOCS.map(d => `<option ${d === f.doc ? "selected" : ""}>${d}</option>`).join("")}</select><button class="btn bad sm" data-del>Remove</button></div></div></div>`).join(""); files.forEach(f => f.shown = true);
}
document.addEventListener("change", e => { const r = e.target.closest(".file"); if (r && e.target.dataset.doc !== undefined) files[+r.dataset.i].doc = e.target.value; });
document.addEventListener("click", async e => {
  const row = e.target.closest(".file"); if (!row) return; const f = files[+row.dataset.i], b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) f.mode = b.dataset.k;
  else if (b.dataset.m) f.copies = Math.max(1, Math.min(99, f.copies + +b.dataset.m));
  else if (b.dataset.col) f.color = b.dataset.col === "1";
  else if (b.hasAttribute("data-del")) files.splice(+row.dataset.i, 1);
  else if (b.hasAttribute("data-crop")) { const r = await cropDialog(f.blob); if (r) await setBlob(f, r); }
  render();
});
async function cropDialog(blob) {
  if (!window.Cropper) { try { await lazy("https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js", "https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"); } catch { toast("Could not load the crop tool. Check your internet."); return null; } }
  return new Promise(res => {
    const m = $("#modal"), im = $("#cropimg"); im.src = URL.createObjectURL(blob); m.hidden = false;
    const cr = new Cropper(im, { viewMode: 1, autoCropArea: .95, background: false });
    const done = v => { cr.destroy(); m.hidden = true; res(v); };
    $("#cx").onclick = () => done(null);
    $("#cok").onclick = () => cr.getCroppedCanvas({ maxWidth: 2000, maxHeight: 2000 }).toBlob(b => done(b), "image/jpeg", .92);
  });
}
function put(blob, name, meta, onp) {
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `${NTFY}/${topic}?f=${encodeURIComponent(name)}&m=${encodeURIComponent(JSON.stringify(meta))}`);
    x.setRequestHeader("Content-Type", blob.type || "application/octet-stream");
    x.upload.onprogress = e => e.lengthComputable && onp(e.loaded / e.total);
    x.onload = () => x.status < 300 ? ok() : no(new Error(x.status === 413 ? "File is too large (max 15 MB)" : x.status === 429 ? "Too many uploads, wait a minute and retry" : "Upload failed (" + x.status + ")"));
    x.onerror = () => no(new Error("No internet connection")); x.send(blob);
  });
}
async function sendAll() {
  const btn = $("#send"), t = $("#sendt"), p = $("#prog"), who = $("#who").value.trim() || "Customer"; btn.disabled = true;
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i]; t.textContent = `Sending ${i + 1} of ${files.length}…`;
      let out = f.blob, name = f.name.replace(/[^\w.\-]+/g, "_");
      if (f.img) { const img = await loadImg(URL.createObjectURL(f.blob)); out = await toBlob(enhanceCanvas(toCanvas(img, 1800), f.mode)); name = name.replace(/\.[^.]*$/, "") + ".jpg"; }
      await put(out, name, { n: who, c: f.copies, k: f.color, d: f.doc }, v => p.style.width = ((i + v) / files.length * 100) + "%");
    }
    const n = files.length; files.length = 0; scrollTo(0, 0);
    app.innerHTML = `<header class="hero" style="padding-bottom:96px">${floaters()}<div class="okring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg></div><h1>Thank you!</h1><p>Your ${n} file${n > 1 ? "s have" : " has"} been sent to ${esc(S.name)}.</p><span class="pill">Please tell the counter your name</span></header><main class="pull">${rateCard()}<section class="card" style="text-align:center"><b>What happens next?</b><p class="mut" style="margin:6px 0 14px">We will check your documents and print them. You will be called when they are ready.</p><button class="btn" onclick="location.reload()">Send more files</button></section></main>`; confetti(); 
  } catch (e) { toast(e.message); btn.disabled = false; t.textContent = "Try again"; p.style.width = 0; }
}

/* ================= SHOP OWNER ================= */
const jobs = new Map(), state = JSON.parse(localStorage.qsp_state || "{}");
const save = () => localStorage.qsp_state = JSON.stringify(state);
function adminView() {
  const id = localStorage.qsp_topic || (localStorage.qsp_topic = "qp" + rand(22));
  let cfg = { ...CFG, ...JSON.parse(localStorage.qsp_cfg || "{}") };
  document.title = "Dashboard | " + cfg.name;
  const linkOf = () => { const u = new URLSearchParams({ s: id, n: cfg.name }); if (cfg.welcome !== CFG.welcome) u.set("w", cfg.welcome); if (cfg.review) u.set("r", cfg.review); if (cfg.phone) u.set("p", cfg.phone); return (location.protocol === "file:" ? (cfg.site || "") : location.href.split(/[?#]/)[0]) + "?" + u; };
  app.innerHTML = `<div class="top"><div class="brand"><img class="logo sm" src="${LOGO}" alt=""><div><b id="bn">${esc(cfg.name)}</b><small>Shop dashboard</small></div></div><div class="st" id="st"><i></i><span>Connecting…</span></div></div>
  <main><div class="stats"><div class="w"><b id="s1">0</b><span>Waiting</span></div><div class="a"><b id="s2">0</b><span>Approved</span></div><div class="p"><b id="s3">0</b><span>Printed</span></div></div>
  <div class="head"><h2>Incoming files</h2></div><div id="jobs"></div>
  <div class="head"><h2>Customer QR code</h2></div>
  <section class="card"><div class="qrrow"><div id="qr" class="qrbox"></div><div class="qinfo"><p class="mut" style="margin-top:0">Print this QR and stick it at your counter. Customers scan it to upload files.</p>
  <input id="lk" readonly aria-label="Customer link"><div class="row"><button class="btn ghost sm" id="cp">Copy link</button><button class="btn sm" id="dl">Download QR</button></div></div></div>
  ${location.protocol === "file:" ? '<p class="mut" style="color:var(--bad)">Paste your website (GitHub Pages) link in Shop settings below. Without it the QR cannot open on phones.</p>' : ""}</section>
  <div class="head"><h2>Shop settings</h2></div>
  <section class="card"><label>Shop name<input id="c1" type="text" value="${esc(cfg.name)}"></label>
  <label>Welcome message<textarea id="c2">${esc(cfg.welcome)}</textarea></label>
  <label>Phone / WhatsApp number (optional)<input id="c3" type="tel" placeholder="+91 98XXXXXXXX" value="${esc(cfg.phone)}"></label>
  <label>Google review link<input id="c4" type="url" placeholder="https://g.page/r/…/review" value="${esc(cfg.review)}"></label>
  ${location.protocol === "file:" ? `<label>Website link (your GitHub Pages link)<input id="c5" type="url" placeholder="https://yourname.github.io/yourrepo/" value="${esc(cfg.site || "")}"></label>` : ""}
  <p class="mut" style="margin-top:0">Get this link in Google Business Profile: open your profile, tap "Ask for reviews", then copy the link. Customers who tap the star button will land directly on your Google rating page.</p>
  <button class="btn" id="sv" style="width:100%">Save and update QR</button></section>
  <p class="note">Keep this page open while you work. Files are held on a relay server for 3 hours, so you can refresh without losing them.</p></main>`;
  const qr = async () => {
    $("#lk").value = linkOf(); if (!window.QRCode) await lazy("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js");
    $("#qr").innerHTML = ""; new QRCode($("#qr"), { text: linkOf(), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
  };
  qr();
  $("#sv").onclick = () => {
    const url = $("#c4").value.trim(); if (url && !safeUrl(url)) return toast("Review link must start with https://");
    cfg = { name: $("#c1").value.trim() || CFG.name, welcome: $("#c2").value.trim() || CFG.welcome, phone: $("#c3").value.trim(), review: url, site: $("#c5") ? $("#c5").value.trim().split(/[?#]/)[0] : cfg.site };
    localStorage.qsp_cfg = JSON.stringify(cfg); $("#bn").textContent = cfg.name; qr(); toast("Saved. Download the new QR and replace the old one.");
  };
  $("#cp").onclick = () => navigator.clipboard.writeText(linkOf()).then(() => toast("Link copied"));
  $("#dl").onclick = () => { const c = $("#qr canvas"), a = document.createElement("a"); a.href = c.toDataURL(); a.download = "shop-qr.png"; a.click(); };
  $("#jobs").onclick = async e => {
    const b = e.target.closest("button"), j = jobs.get(b?.closest(".job")?.dataset.id); if (!b || !j) return;
    if (b.dataset.a === "view") { if (kindOf(j) === "other") return download(await getBlob(j), j.file); const w = window.open("", "_blank"); w.location = URL.createObjectURL(await getBlob(j)); }
    if (b.dataset.a === "print") { setState(j, "approved"); printJob(j); }
    if (b.dataset.a === "done") setState(j, "printed");
    if (b.dataset.a === "reject") setState(j, "rejected");
  };
  listen(id); list(); setInterval(list, 30000);
  reveal(".stats>div,.head,main>section,.note");
}
function setState(j, s) { j.status = state[j.id] = s; save(); list(); }
async function getBlob(j) {
  if (!j.blob) { const r = await fetch(j.url); if (!r.ok) throw new Error("File expired"); j.blob = await r.blob(); }
  return j.blob;
}
function listen(id) {
  const st = on => { $("#st").className = "st" + (on ? " on" : ""); $("#st span").textContent = on ? "Online" : "Reconnecting…"; };
  const es = new EventSource(`${NTFY}/${id}/sse?since=3h`);
  es.onopen = () => { window.__on = true; st(true); list(); }; es.onerror = () => st(false);
  es.onmessage = async ev => {
    const e = JSON.parse(ev.data); if (e.event !== "message" || !e.attachment || jobs.has(e.id)) return;
    let m = {}; try { m = JSON.parse(e.message); } catch { }
    const j = { id: e.id, t: e.time * 1000, who: m.n || "Customer", doc: m.d || "", file: e.attachment.name, type: e.attachment.type || "", copies: m.c || 1, color: !!m.k, url: e.attachment.url, status: state[e.id] || "pending" };
    jobs.set(e.id, j); if (j.status === "pending") toast("New file from " + j.who); list();
    try { await getBlob(j); list(); } catch { }
  };
}
function list() {
  const box = $("#jobs"); if (!box) return;
  const all = [...jobs.values()].filter(j => j.status !== "rejected").sort((a, b) => b.t - a.t), n = s => all.filter(j => j.status === s).length;
  setNum($("#s1"), n("pending")); setNum($("#s2"), n("approved")); setNum($("#s3"), n("printed"));
  document.title = (n("pending") ? `(${n("pending")}) ` : "") + "Dashboard | " + (JSON.parse(localStorage.qsp_cfg || "{}").name || CFG.name);
  box.innerHTML = all.length ? all.map(j => {
    const img = j.blob && (j.blob.type || j.type).startsWith("image/"); j.u = j.u || (img ? URL.createObjectURL(j.blob) : "");
    const cls = j.shown ? "" : " enter"; j.shown = true;
    return `<div class="card job ${j.status}${cls}" data-id="${j.id}">${j.u ? `<img class="thumb" alt="" src="${j.u}">` : `<div class="thumb">${esc(extOf(j))}</div>`}
    <div><b>${esc(j.who)}</b> <span class="chip ${j.status}">${{ pending: "Waiting", approved: "Approved", printed: "Printed" }[j.status]}</span>${j.doc && j.doc !== "Document" ? `<span class="chip">${esc(j.doc)}</span>` : ""}
    <div class="mut">${esc(j.file)} · ${j.copies} ${j.copies > 1 ? "copies" : "copy"} · ${j.color ? "Colour" : "B&W"} · ${new Date(j.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
    <div class="row" style="margin-top:10px">
    ${j.status === "pending" ? '<button class="btn ghost sm" data-a="view">View</button><button class="btn ok sm" data-a="print">Approve &amp; ' + (window.desktop || kindOf(j) !== "other" ? "print" : "download") + '</button><button class="btn bad sm" data-a="reject">Reject</button>' : ""}
    ${j.status === "approved" ? '<button class="btn sm" data-a="print">Print again</button><button class="btn ok sm" data-a="done">Mark as printed</button>' : ""}</div></div></div>`;
  }).join("") : (window.__on ? '<div class="card empty">No files yet. Scan your own QR with a phone to test.</div>' : '<div class="card sk"></div><div class="card sk"></div>');
}
const extOf = j => ((j.file || "").split(".").pop() || "FILE").slice(0, 5).toUpperCase();
const kindOf = j => { const t = (j.blob && j.blob.type) || j.type || ""; return t.startsWith("image/") ? "img" : (t === "application/pdf" || /\.pdf$/i.test(j.file)) ? "pdf" : "other"; };
function download(b, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click(); }
async function printJob(j) {
  if (window.desktop) { // Windows app: prints silently with the right program for every file type
    try { const b = await getBlob(j); await window.desktop.printFile(await b.arrayBuffer(), j.file, j.copies, j.color); setState(j, "printed"); toast("Sent to printer"); }
    catch (e) { toast((e.message || "Could not print").replace(/^Error invoking remote method '[^']+': (Error: )?/, "")); }
    return;
  }
  if (kindOf(j) === "other") { try { download(await getBlob(j), j.file); toast("Downloaded. Open it and press Ctrl+P to print."); } catch (e) { toast(e.message); } return; }
  const w = window.open("", "_blank"); if (!w) return toast("Allow pop-ups to print");
  try {
    const b = await getBlob(j), url = URL.createObjectURL(b);
    if (kindOf(j) === "pdf") { w.location = url; return; }
    w.document.write(`<title>Print</title><style>@page{margin:8mm}body{margin:0}img{display:block;width:100%;max-height:277mm;object-fit:contain;page-break-after:always}</style>` + Array.from({ length: j.copies }, () => `<img src="${url}">`).join(""));
    w.document.close(); await Promise.all([...w.document.images].map(i => i.decode().catch(() => 0))); w.focus(); w.print();
  } catch (e) { w.close(); toast(e.message || "Could not print"); }
}

topic ? customerView() : adminView();
requestAnimationFrame(() => setTimeout(() => { const sp = $("#splash"); sp.classList.add("out"); setTimeout(() => sp.remove(), 800); }, 1100));
</script>
