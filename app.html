<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryaman Print Suite</title>
<style id="pg"></style>
<style>
:root{--g:#2fc46c;--g2:#1e9e53;--ink:#1d1b18;--mu:#6e6556;--bg:#fbf3e4;--bd:#ecdfc8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:#fbf6ea}
.lg{font-weight:800;font-size:1.1rem;display:flex;gap:8px;align-items:center}.lg i{width:22px;height:22px;border-radius:7px;background:var(--g)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-weight:700;border:0;padding:8px 16px;border-radius:30px;background:rgba(255,255,255,.1);color:#fbf6ea;cursor:pointer;transition:.25s}
nav button:hover{background:rgba(255,255,255,.2)}nav button.on{background:var(--g);color:#fff}
.app{display:grid;grid-template-columns:390px 1fr;gap:16px;padding:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;display:grid;gap:12px;max-height:calc(100vh - 100px);overflow:auto;position:sticky;top:12px}
fieldset{border:1px solid var(--bd);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;margin:0;min-width:0}
legend{font-weight:800;font-size:.72rem;color:var(--g2);padding:0 6px;text-transform:uppercase;letter-spacing:.05em}
label{display:grid;gap:3px;font-size:.78rem;color:var(--mu);font-weight:600}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.b,button.b2{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;transition:.2s}
button.b{background:var(--g);color:#fff;font-size:1rem;padding:13px}button.b:hover{background:var(--g2)}
button.b2{background:var(--bg);border:1px solid var(--bd);color:var(--ink)}button.b2:hover{border-color:var(--g)}
.tip{font-size:.78rem;color:var(--mu);margin:0;line-height:1.5}.warn{color:#b45309;font-size:.8rem;margin:0}
.rw{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--bd)}
.rw button{border:0;background:none;color:#b91c1c;font-size:1.1rem;cursor:pointer}
.vh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:var(--mu);font-size:.85rem}.vh b{color:var(--ink);font-size:1rem}
.stage{background:#d9d4c7;padding:12px;overflow:auto;border-radius:16px}
.sheet{background:#fff;position:relative;margin:auto;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;color:#000}
.ink{position:absolute;left:0;top:0;right:0;bottom:0}
.t{position:absolute;white-space:nowrap;overflow:hidden;line-height:1.2}
.g{color:#9a9384;font-style:italic}.ln{position:absolute;left:0;right:0;border-top:1px dashed #cfc8b8}
.bx{position:absolute;border:1px solid #000;display:grid;place-items:center;overflow:hidden}.bx img{width:100%;height:100%;object-fit:cover}
.hl{position:absolute;left:0;right:0;border-top:1px solid #000}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media print{
 html,body{margin:0;background:none}header,.panel,.vh{display:none!important}
 .app{display:block;padding:0}.stage{background:none;padding:0;overflow:visible;border-radius:0}
 .sheet{box-shadow:none;margin:0;zoom:1!important;background:none}.g,.ln{display:none!important}
}
</style>
</head>
<body>
<header><div class="lg"><i></i>Aryaman Print Suite</div><nav id="tabs"></nav></header>
<main class="app">
 <aside class="panel" id="panel"></aside>
 <section><div class="vh"><b id="vt"></b><span>Preview is scaled to fit. Printing uses the real paper size.</span></div><div class="stage"><div class="sheet" id="sheet"></div></div></section>
</main>
<script>
const $=s=>document.querySelector(s),KEY='aryaman_print_v1';
const PAPER={A4:[210,297,'A4 portrait'],A5L:[210,148,'A5 landscape'],PB:[190,130,'Passbook 190 x 130 mm'],A5:[148,210,'A5 portrait']};
const NAMES={pass:'Passbook Print',form:'Form Print',kyc:'KYC Print',slip:'Slip Print'};
const DEF={pass:{ox:0,oy:0,fs:10,ff:'Arial',paper:'PB',top:28,lh:7,lpp:20},form:{ox:0,oy:0,fs:11,ff:'Arial',paper:'A4'},kyc:{ox:0,oy:0,fs:11,ff:'Arial',paper:'A4'},slip:{ox:0,oy:0,fs:11,ff:'Arial',paper:'A5L'}};
const CF=[['name','Customer name'],['father','Father / Husband name'],['dob','Date of birth','date'],['gender','Gender','sel'],['mobile','Mobile number','tel'],['acc','Account number'],['aadhaar','Aadhaar number'],['pan','PAN'],['addr','Address','ta']];
let S={tab:'pass',c:{},custs:[],cal:{},pass:{open:0,line:1,rows:[]},slip:{type:'DEPOSIT',amt:'',no:1},kyc:{mask:false,photo:''},form:{labels:true,atype:'Savings'}};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j){S.custs=j.custs||[];S.cal=j.cal||{};S.pass.open=j.open||0;S.pass.line=j.line||1;S.slip.no=j.slipNo||1}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({custs:S.custs,cal:S.cal,open:S.pass.open,line:S.pass.line,slipNo:S.slip.no}))}catch(e){}}
const cal=()=>Object.assign({},DEF[S.tab],S.cal[S.tab]);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const gp=p=>p.split('.').reduce((o,k)=>o[k],S),sp=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s.split('-').reverse().join('/'):(s||'');
const fmt=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const A=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],B=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const two=n=>n<20?A[n]:B[Math.floor(n/10)]+(n%10?' '+A[n%10]:'');
function W(n){if(!n)return 'Zero';let s='';const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1e3);n%=1e3;const h=Math.floor(n/100);n%=100;
 if(cr)s+=two(cr)+' Crore ';if(l)s+=two(l)+' Lakh ';if(t)s+=two(t)+' Thousand ';if(h)s+=A[h]+' Hundred ';if(n)s+=two(n);return s.trim()}
const T=(x,y,t,o={})=>`<div class="t${o.g?' g':''}" style="left:${x}mm;top:${y}mm;${o.w?`width:${o.w}mm;`:''}${o.a?`text-align:${o.a};`:''}${o.s?`font-size:${o.s}pt;`:''}${o.b?'font-weight:700;':''}${o.p?'white-space:pre-line;overflow:visible;':''}">${esc(t)}</div>`;
const HL=(x,y,w)=>`<div class="hl" style="left:${x}mm;top:${y}mm;width:${w}mm;right:auto"></div>`;
/* ---------- sheets ---------- */
const FL=[['name','Name',7,45,62,150],['father','Father / Husband',7,45,74,150],['dob','Date of birth',7,45,86,55],['gender','Gender',105,135,86,60],['mobile','Mobile',7,45,98,55],['acc','Account no.',105,135,98,60],['aadhaar','Aadhaar',7,45,110,55],['pan','PAN',105,135,110,60],['addr','Address',7,45,122,150]];
const R={
pass(){const c=cal(),X=[[6,22],[30,62],[94,24],[120,24],[146,36]];let run=+S.pass.open||0,h='',over=0;
 for(let i=0;i<c.lpp;i++)h+=`<div class="ln" style="top:${c.top+i*c.lh+c.lh-.5}mm"></div>`;
 ['Date','Particulars','Withdrawal','Deposit','Balance'].forEach((t,i)=>h+=T(X[i][0],c.top-c.lh,t,{g:1,w:X[i][1],a:i>1?'right':'left',s:8}));
 S.pass.rows.forEach((r,i)=>{run+=(r.cr||0)-(r.dr||0);const ln=S.pass.line-1+i;if(ln>=c.lpp){over++;return}const y=c.top+ln*c.lh;
  h+=T(X[0][0],y,fd(r.d),{w:X[0][1]})+T(X[1][0],y,r.p,{w:X[1][1]})+T(X[2][0],y,r.dr?fmt(r.dr):'',{w:X[2][1],a:'right'})+T(X[3][0],y,r.cr?fmt(r.cr):'',{w:X[3][1],a:'right'})+T(X[4][0],y,fmt(run),{w:X[4][1],a:'right'})});
 const w=$('#warn');if(w)w.textContent=over?over+' row(s) do not fit on this page ('+c.lpp+' lines). Print now, then press "Printed: advance line".':'';return h},
form(){const c=S.c,L=S.form.labels;let h=L?T(0,14,'ACCOUNT OPENING FORM',{w:210,a:'center',s:16,b:1}):'';
 FL.forEach(([k,lab,lx,x,y,w])=>{h+=T(lx,y,lab,{g:!L,s:9,b:L,w:36})+T(x,y,k==='dob'?fd(c.dob):c[k],{w,p:k==='addr'})});
 h+=T(7,150,'Account type',{g:!L,s:9,b:L,w:36})+T(45,150,S.form.atype,{w:60})+T(105,36,'Date',{g:!L,s:9,b:L,w:28})+T(135,36,fd(iso()),{w:40});return h},
kyc(){const c=S.c;let h=T(20,18,'KYC DETAILS',{s:20,b:1,w:120})+HL(20,30,170);
 h+=`<div class="bx" style="left:150mm;top:36mm;width:40mm;height:50mm">${S.kyc.photo?`<img src="${S.kyc.photo}">`:'<span class="g" style="font-size:9pt">PHOTO</span>'}</div>`;
 let a=(c.aadhaar||'').replace(/\D/g,'');if(S.kyc.mask&&a.length>=4)a='XXXX XXXX '+a.slice(-4);else a=c.aadhaar;
 [['Name',c.name],['Date of birth',fd(c.dob)],['Gender',c.gender],['Mobile',c.mobile],['Aadhaar',a],['PAN',c.pan]].forEach(([l,v],i)=>{const y=40+i*11;h+=T(20,y,l,{b:1,w:40})+T(62,y,v,{w:85})});
 h+=T(20,108,'Address',{b:1,w:40})+T(62,108,c.addr,{w:125,p:1})+T(20,180,'Date: '+fd(iso()),{w:60})+HL(130,190,60)+T(130,192,'Customer signature',{s:9,w:60})+T(20,280,'Prepared with Aryaman Print Suite',{s:8,g:1,w:100});return h},
slip(){const c=S.c,s=S.slip,amt=+s.amt||0,r=Math.floor(amt),p=Math.round((amt-r)*100);
 let h=T(0,10,s.type+' SLIP',{w:210,a:'center',s:16,b:1})+HL(10,20,190)+T(10,25,'Slip No: '+s.no,{w:70})+T(140,25,'Date: '+fd(iso()),{w:60,a:'right'});
 h+=T(10,40,'Account No',{b:1,w:40})+T(52,40,c.acc,{w:140})+T(10,52,'Account holder',{b:1,w:40})+T(52,52,c.name,{w:140})+T(10,64,'Amount',{b:1,w:40})+T(52,64,amt?'\u20B9 '+fmt(amt):'',{w:140,s:14,b:1});
 h+=T(10,78,'In words',{b:1,w:40})+T(52,78,amt?'Rupees '+W(r)+(p?' and '+two(p)+' Paise':'')+' Only':'',{w:145,p:1});
 return h+HL(10,122,60)+T(10,124,'Cashier',{s:9,w:60})+HL(140,122,60)+T(140,124,'Customer signature',{s:9,w:60})}};
function draw(){const c=cal(),[w,h]=PAPER[c.paper],sh=$('#sheet');$('#pg').textContent=`@page{size:${w}mm ${h}mm;margin:0}`;
 sh.style.width=w+'mm';sh.style.height=h+'mm';sh.innerHTML=`<div class="ink" style="transform:translate(${c.ox}mm,${c.oy}mm);font-size:${c.fs}pt;font-family:${c.ff}">${R[S.tab]()}</div>`;$('#vt').textContent=NAMES[S.tab];fit()}
function fit(){const sh=$('#sheet');sh.style.zoom=Math.min(1.3,($('.stage').clientWidth-24)/(PAPER[cal().paper][0]*3.7795))}
/* ---------- panel ---------- */
const inS=(l,p,t='text',x='')=>`<label>${l}<input data-s="${p}" type="${t}" value="${esc(gp(p))}" ${x}></label>`;
const inK=(l,k,x='')=>`<label>${l}<input data-k="${k}" type="number" value="${cal()[k]}" ${x}></label>`;
function fld(k){const [,l,t]=CF.find(x=>x[0]===k),v=S.c[k]||'';
 if(t==='ta')return `<label>${l}<textarea data-c="${k}" rows="3">${esc(v)}</textarea></label>`;
 if(t==='sel')return `<label>${l}<select data-c="${k}">${['','Male','Female','Other'].map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select></label>`;
 return `<label>${l}<input data-c="${k}" type="${t||'text'}" value="${esc(v)}"></label>`}
const fl=(ks,t='Customer details')=>`<fieldset><legend>${t}</legend>${ks.map(fld).join('')}</fieldset>`;
const TP={
pass:()=>`<fieldset><legend>Passbook</legend><div class="r2">${inS('Opening balance','pass.open','number','step="0.01"')}${inS('Print from line no.','pass.line','number','min="1"')}</div></fieldset>
<fieldset><legend>Add transaction</legend><div class="r2"><label>Date<input id="td" type="date" value="${iso()}"></label><label>Type<select id="tt"><option value="Cr">Cr (Deposit)</option><option value="Dr">Dr (Withdrawal)</option></select></label></div><label>Particulars<input id="tp" placeholder="e.g. CASH DEPOSIT"></label><label>Amount<input id="ta" type="number" step="0.01"></label><button class="b2" data-a="add">Add row</button></fieldset>
<fieldset><legend>Rows to print</legend><div id="rl"></div><p id="warn" class="warn"></p><div class="r2"><button class="b2" data-a="adv">Printed: advance line</button><button class="b2" data-a="clr">Clear rows</button></div></fieldset>`,
form:()=>fl(['name','father','dob','gender','mobile','acc','aadhaar','pan','addr'])+`<fieldset><legend>Form options</legend><label>Account type<select data-s="form.atype">${['Savings','Current','Recurring Deposit','Fixed Deposit'].map(o=>`<option${o===S.form.atype?' selected':''}>${o}</option>`).join('')}</select></label><label class="ck"><input type="checkbox" data-s="form.labels"${S.form.labels?' checked':''}> Print labels and title (for plain paper). Turn off for pre-printed forms.</label></fieldset>`,
kyc:()=>fl(['name','dob','gender','mobile','aadhaar','pan','addr'])+`<fieldset><legend>Photo and options</legend><label>Customer photo<input type="file" id="ph" accept="image/*"></label><label class="ck"><input type="checkbox" data-s="kyc.mask"${S.kyc.mask?' checked':''}> Mask Aadhaar (show last 4 digits only)</label></fieldset>`,
slip:()=>fl(['name','acc'],'Account')+`<fieldset><legend>Slip</legend><label>Slip type<select data-s="slip.type">${['DEPOSIT','WITHDRAWAL'].map(o=>`<option${o===S.slip.type?' selected':''}>${o}</option>`).join('')}</select></label><div class="r2">${inS('Amount (INR)','slip.amt','number','step="0.01"')}${inS('Slip number','slip.no','number')}</div><button class="b2" data-a="next">Next slip (number +1, clear amount)</button></fieldset>`};
function calBox(){const c=cal();return `<fieldset><legend>Printer alignment</legend><label>Paper<select data-k="paper">${Object.entries(PAPER).map(([k,v])=>`<option value="${k}"${c.paper===k?' selected':''}>${v[2]}</option>`).join('')}</select></label><div class="r2">${inK('Shift right (mm)','ox','step="0.5"')}${inK('Shift down (mm)','oy','step="0.5"')}</div><div class="r2">${inK('Font size (pt)','fs','step="0.5"')}<label>Font<select data-k="ff">${['Arial','Courier New','Times New Roman'].map(o=>`<option${o===c.ff?' selected':''}>${o}</option>`).join('')}</select></label></div>${S.tab==='pass'?`<div class="r2">${inK('First line from top (mm)','top','step="0.5"')}${inK('Line gap (mm)','lh','step="0.1"')}</div>${inK('Lines per page','lpp')}`:''}</fieldset>`}
function build(){let h='';
 if(S.tab!=='pass')h+=`<fieldset><legend>Saved customers</legend><label>Select customer<select id="cs"><option value="">New customer</option>${S.custs.map((x,i)=>`<option value="${i}">${esc(x.name)}${x.acc?' - '+esc(x.acc):''}</option>`).join('')}</select></label><div class="r2"><button class="b2" data-a="savec">Save customer</button><button class="b2" data-a="delc">Delete selected</button></div></fieldset>`;
 h+=TP[S.tab]()+calBox()+`<button class="b" data-a="print">Print ${NAMES[S.tab]}</button><p class="tip">Tip: print once on plain paper, hold it over your passbook or form against the light, then adjust the shift values until it lines up. Settings are saved in this browser.</p>`;
 $('#panel').innerHTML=h;if(S.tab==='pass')rows()}
function rows(){const e=$('#rl');if(!e)return;e.innerHTML=S.pass.rows.length?S.pass.rows.map((r,i)=>`<div class="rw"><span>${fd(r.d)} · ${esc(r.p)} · ${r.cr?'Cr '+fmt(r.cr):'Dr '+fmt(r.dr)}</span><button data-a="del" data-i="${i}" title="Remove">&times;</button></div>`).join(''):'<p class="tip">No rows added yet.</p>'}
/* ---------- events ---------- */
const P=$('#panel');
P.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.c)S.c[d.c]=t.value;
 else if(d.s){sp(d.s,t.type==='checkbox'?t.checked:t.type==='number'?parseFloat(t.value)||0:t.value);save()}
 else if(d.k){(S.cal[S.tab]=S.cal[S.tab]||{})[d.k]=t.type==='number'?parseFloat(t.value)||0:t.value;save()}
 else return;draw()});
P.addEventListener('change',e=>{const t=e.target;
 if(t.id==='cs'){S.c=t.value===''?{}:Object.assign({},S.custs[+t.value]);build();$('#cs').value=t.value;draw()}
 if(t.id==='ph'&&t.files[0]){const f=new FileReader();f.onload=()=>{S.kyc.photo=f.result;draw()};f.readAsDataURL(t.files[0])}});
P.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='print')window.print();
 else if(a==='add'){const amt=parseFloat($('#ta').value),p=$('#tp').value.trim();if(!(amt>0)||!p){alert('Enter particulars and a valid amount.');return}
  const cr=$('#tt').value==='Cr';S.pass.rows.push({d:$('#td').value,p:p.toUpperCase(),cr:cr?amt:0,dr:cr?0:amt});$('#tp').value='';$('#ta').value='';rows();draw()}
 else if(a==='del'){S.pass.rows.splice(+b.dataset.i,1);rows();draw()}
 else if(a==='clr'){S.pass.rows=[];rows();draw()}
 else if(a==='adv'){const c=cal();let run=+S.pass.open||0;S.pass.rows.forEach(r=>run+=(r.cr||0)-(r.dr||0));S.pass.open=Math.round(run*100)/100;S.pass.line+=S.pass.rows.length;
  if(S.pass.line>c.lpp){S.pass.line=1;alert('Page is full. Insert the next passbook page: line reset to 1.')}S.pass.rows=[];save();build();draw()}
 else if(a==='next'){S.slip.no=(+S.slip.no||0)+1;S.slip.amt='';save();build();draw()}
 else if(a==='savec'){if(!S.c.name){alert('Enter the customer name first.');return}const i=S.custs.findIndex(x=>x.name===S.c.name&&x.acc===S.c.acc);
  if(i>=0)S.custs[i]=Object.assign({},S.c);else S.custs.push(Object.assign({},S.c));save();build();alert('Customer saved in this browser.')}
 else if(a==='delc'){const v=$('#cs').value;if(v===''||!confirm('Delete this saved customer?'))return;S.custs.splice(+v,1);save();build()}});
$('#tabs').innerHTML=Object.entries(NAMES).map(([k,v])=>`<button data-t="${k}">${v.replace(' Print','')}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;S.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));build();draw()});
window.addEventListener('resize',fit);
load();document.querySelector('#tabs button').classList.add('on');build();draw();
</script>
</body>
</html>
